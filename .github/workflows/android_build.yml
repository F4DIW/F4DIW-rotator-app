name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/f4diw-rotator-build-${{ steps.date.outputs.date }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: f4diw-rotator-build-${{ steps.date.outputs.date }}
        path: app/build/outputs/apk/debug/f4diw-rotator-build-${{ steps.date.outputs.date }}.apk
